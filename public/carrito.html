<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Carrito</title>
    <link rel="stylesheet" href="/css/estilos.css">
    <script src="/js/app.js"></script>
</head>

<body onload="cargarCarrito()">
    <header>
        <h1>Carrito</h1>
        <nav><a href="/productos.html">Productos</a><a href="/">Inicio</a><button onclick="cerrarSesion()">Cerrar
                sesión</button></nav>
    </header>
    <main>
        <div class="panel">
            <h2>Mi carrito</h2>
            <table>
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Precio</th>
                        <th>Cantidad</th>
                        <th>Total</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tabla"></tbody>
            </table>
            <h2 id="total">Total: $0.00</h2><a href="/checkout.html"><button>Continuar compra</button></a>
        </div>
    </main>
</body>

</html>
