<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
    <link rel="stylesheet" href="/css/estilos.css">
    <script src="/js/app.js"></script>
</head>

<body onload="cargarUsuarios()">
    <header>
        <h1>Usuarios</h1>
        <nav><a href="/admin.html">Admin</a></nav>
    </header>
    <main>
        <div class="panel">
            <h2>Nuevo / editar usuario</h2>
            <form id="formUsuario" onsubmit="event.preventDefault();guardarUsuario()"><input type="hidden"
                    id="idUsuario">
                <div class="form-grid"><input id="nombre" placeholder="Nombre"><input id="apellidoP"
                        placeholder="Apellido paterno"><input id="apellidoM" placeholder="Apellido materno"><input
                        id="correo" placeholder="Correo"><input id="rfc" placeholder="RFC"><input id="curp"
                        placeholder="CURP"><input id="password" type="password"
                        placeholder="Contraseña nueva (solo al crear)"><select id="tipo">
                        <option value="admin">Administrador</option>
                        <option value="cliente">Cliente</option>
                        <option value="inventario">Inventarios / auxiliar</option>
                    </select></div><button>Guardar usuario</button>
            </form>
        </div>
        <div class="panel">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Tipo</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla"></tbody>
            </table>
        </div>
    </main>
</body>

</html>
